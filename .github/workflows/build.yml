name: Build Firmware
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.3
          target: esp32c6
          path: '.'
      - run: |
          mkdir -p firmware
          cp build/bootloader/bootloader.bin firmware/
          cp build/partition_table/partition-table.bin firmware/
          cp build/angel.bin firmware/ 2>/dev/null || cp build/Meshxiaoo-v2.bin firmware/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with:
          name: xiaomesh-firmware
          path: firmware/
          retention-days: 30
