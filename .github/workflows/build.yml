name: Build Firmware

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build with ESP-IDF
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.3
          target: esp32c6
          path: '.'

      - name: Copy binaries to docs
        run: |
          cp build/bootloader/bootloader.bin docs/bootloader.bin
          cp build/partition_table/partition-table.bin docs/partition-table.bin
          if [ -f build/angel.bin ]; then
            cp build/angel.bin docs/angel.bin
          elif [ -f build/xiaomesh.bin ]; then
            cp build/xiaomesh.bin docs/angel.bin
          fi
          rm -f docs/xiaomesh.bin

      - name: Commit and push binaries
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          if ! git diff --staged --quiet; then
            git commit -m "Auto: update binaries in docs [skip ci]"
            git push
          else
            echo "No changes to commit"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: angel-firmware
          path: |
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
            build/angel.bin
          retention-days: 30
